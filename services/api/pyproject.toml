[project]
name = "parampara-api"
version = "0.0.0"
description = "Parampara API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "google-genai>=1.0",
  "pynacl>=1.5",
  "rfc8785>=0.1.4",
  "base58>=2.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "datamodel-code-generator>=0.26",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parampara"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/parampara/domain/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["src/parampara/domain/generated.py"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["parampara.tools.*", "parampara.agents.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
